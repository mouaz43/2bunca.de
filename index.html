  <style>
    :root{
      --bg:#f7f4ef; --surface:#ffffff; --ink:#211610;
      --ink-70:rgba(33,22,16,.72); --ink-55:rgba(33,22,16,.55); --ink-35:rgba(33,22,16,.35);
      --accent:#8b5a34; --accent-dark:#6b4226; --accent-soft:#f1e6db;
      --border:rgba(33,22,16,.10); --border-strong:rgba(33,22,16,.20);
      --success:#1f7a4d; --success-soft:#e8f5ee;
      --danger:#b3261e; --danger-soft:#fbeae8;
      --warn:#9a5b00; --warn-soft:#fbf0dd;
      --shadow-xs:0 1px 2px rgba(33,22,16,.06);
      --shadow-sm:0 4px 14px rgba(33,22,16,.08);
      --shadow-md:0 14px 30px rgba(33,22,16,.10);
      --shadow-lift:0 20px 44px rgba(33,22,16,.18);
      --radius-sm:10px; --radius-md:14px; --radius-lg:20px;
      --ease:cubic-bezier(.2,.8,.2,1); --dur-fast:120ms; --dur:220ms;
    }
    *{ box-sizing:border-box; }
    body{ font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--ink); -webkit-font-smoothing:antialiased; }
    .h1{ font-family:"Playfair Display",serif; }
    *:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; border-radius:6px; }

    .card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); box-shadow:var(--shadow-xs); }
    .card-item{ transition:transform var(--dur) var(--ease), box-shadow var(--dur) var(--ease), border-color var(--dur) var(--ease); }
    .card-item:hover{ transform:translateY(-3px); box-shadow:var(--shadow-sm); border-color:var(--border-strong); }

    .btn{ display:inline-flex; align-items:center; justify-content:center; gap:.5rem; border-radius:var(--radius-md); padding:.8rem 1.1rem; font-weight:600; min-height:44px; border:1px solid transparent; cursor:pointer; user-select:none; box-shadow:var(--shadow-xs); transition:transform var(--dur-fast) var(--ease), box-shadow var(--dur-fast) var(--ease), background-color var(--dur-fast) var(--ease), border-color var(--dur-fast) var(--ease), opacity var(--dur-fast) var(--ease); }
    .btn:hover{ transform:translateY(-1px); box-shadow:var(--shadow-sm); }
    .btn:active{ transform:translateY(0) scale(.97); box-shadow:var(--shadow-xs); }
    .btn:disabled{ opacity:.5; cursor:not-allowed; transform:none; box-shadow:none; }
    .btn-sm{ padding:.5rem .85rem; min-height:36px; font-size:.85rem; border-radius:var(--radius-sm); }
    .btn-ghost{ background:var(--surface); color:var(--ink); border-color:var(--border-strong); }
    .btn-ghost:hover{ background:var(--accent-soft); border-color:var(--accent); }
    .btn-primary{ background:var(--ink); color:#fff; border-color:var(--ink); }
    .btn-primary:hover{ background:#0f0906; }
    .btn-accent{ background:var(--accent); color:#fff; border-color:var(--accent); }
    .btn-accent:hover{ background:var(--accent-dark); }
    .btn-danger{ background:var(--surface); color:var(--danger); border-color:rgba(179,38,30,.35); }
    .btn-danger:hover{ background:var(--danger-soft); border-color:var(--danger); }
    .btn-toggle-on{ background:var(--accent-soft); border-color:var(--accent); color:var(--accent-dark); }
    .btn svg{ width:16px; height:16px; flex:none; }

    .input{ border:1px solid var(--border-strong); border-radius:var(--radius-sm); padding:.85rem .95rem; min-height:44px; background:var(--surface); color:var(--ink); width:100%; transition:border-color var(--dur-fast) var(--ease), box-shadow var(--dur-fast) var(--ease); }
    .input:focus{ outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }
    .input::placeholder{ color:var(--ink-35); }
    input[type="radio"]{ width:18px; height:18px; accent-color:var(--accent); cursor:pointer; }

    .pill{ display:inline-flex; align-items:center; gap:.35rem; border-radius:999px; border:1px solid var(--border-strong); padding:.45rem .9rem; font-size:.85rem; background:var(--surface); color:var(--ink-70); cursor:pointer; transition:background var(--dur-fast) var(--ease), border-color var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease); }
    .pill:hover{ border-color:var(--accent); color:var(--ink); }
    .pill.is-active{ background:var(--ink); color:#fff; border-color:var(--ink); }

    .radio-row{ display:flex; align-items:center; gap:.6rem; padding:.5rem .25rem; border-radius:var(--radius-sm); transition:background var(--dur-fast) var(--ease); cursor:pointer; }
    .radio-row:hover{ background:var(--accent-soft); }

    .tab{ position:relative; border-radius:var(--radius-sm); padding:.55rem .95rem; color:var(--ink-70); font-weight:500; transition:color var(--dur-fast) var(--ease), background-color var(--dur-fast) var(--ease); }
    .tab:hover{ background:var(--accent-soft); color:var(--ink); }
    .tab-active{ background:var(--ink); color:#fff !important; }

    .nav-icon{ position:relative; width:22px; height:22px; display:inline-flex; }
    .nav-icon svg{ width:100%; height:100%; }
    .nav-lock{ position:absolute; right:-6px; bottom:-4px; width:13px; height:13px; background:var(--surface); border-radius:50%; display:none; align-items:center; justify-content:center; box-shadow:var(--shadow-xs); color:var(--ink-55); }
    .nav-lock svg{ width:8px; height:8px; }

    .stock-dot{ display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--danger); margin-right:5px; }

    .hero{ position:relative; overflow:hidden; background:radial-gradient(130% 160% at 12% 15%, #3c2717 0%, #241811 55%, #150e09 100%); color:#fff; }
    .hero:before{ content:''; position:absolute; inset:0; background-image:radial-gradient(circle at 85% 8%, rgba(255,255,255,.10), transparent 40%), radial-gradient(circle at 6% 92%, rgba(255,255,255,.06), transparent 45%); pointer-events:none; }
    .hero-stat{ display:inline-flex; align-items:center; gap:.5rem; background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.16); border-radius:999px; padding:.4rem .85rem; font-size:.8rem; backdrop-filter:blur(4px); }
    .hero-stat .dot{ width:6px; height:6px; border-radius:50%; background:#f5b942; }

    .grain:before{ content:''; position:fixed; inset:0; pointer-events:none; background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" opacity="0.06"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="4" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(%23n)"/></svg>'); mix-blend-mode:multiply; z-index:0; }
    @supports (padding: max(0px)) { .safe-bottom{ padding-bottom:max(env(safe-area-inset-bottom),12px); } }

    #toastRoot{ position:fixed; z-index:60; left:50%; transform:translateX(-50%); bottom:calc(84px + env(safe-area-inset-bottom,0px)); display:flex; flex-direction:column; gap:.5rem; width:min(380px, calc(100vw - 24px)); pointer-events:none; }
    @media (min-width:1024px){ #toastRoot{ left:auto; right:24px; transform:none; bottom:24px; } }
    .toast{ pointer-events:auto; cursor:pointer; background:var(--ink); color:#fff; border-radius:var(--radius-md); padding:.85rem 1rem; box-shadow:var(--shadow-lift); font-size:.9rem; animation:toast-in var(--dur) var(--ease); }
    .toast.success{ background:var(--success); }
    .toast.warn{ background:var(--warn); }
    .toast.danger{ background:var(--danger); }
    .toast.leaving{ animation:toast-out var(--dur-fast) var(--ease) forwards; }
    @keyframes toast-in{ from{ opacity:0; transform:translateY(10px) scale(.97);} to{ opacity:1; transform:none; } }
    @keyframes toast-out{ to{ opacity:0; transform:translateY(6px) scale(.97);} }

    #modalRoot{ position:fixed; inset:0; z-index:70; display:none; align-items:center; justify-content:center; padding:20px; }
    #modalRoot.open{ display:flex; }
    .modal-backdrop{ position:absolute; inset:0; background:rgba(21,14,9,.5); backdrop-filter:blur(2px); animation:fade-in var(--dur) var(--ease); }
    .modal-panel{ position:relative; background:var(--surface); border-radius:var(--radius-lg); box-shadow:var(--shadow-lift); padding:1.5rem; width:100%; max-width:400px; animation:modal-in var(--dur) var(--ease); }
    @keyframes fade-in{ from{ opacity:0; } to{ opacity:1; } }
    @keyframes modal-in{ from{ opacity:0; transform:translateY(14px) scale(.97);} to{ opacity:1; transform:none; } }
  </style>
</head>

  <script>
    const ICONS = {
      trash: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16"/><path d="M9 7V4h6v3"/><path d="M6 7l1 13h10l1-13"/></svg>`,

      plus: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>`,
      x: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>`,
      check: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12.5l5 5L20 6.5"/></svg>`,
      send: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4Z"/></svg>`,
      mail: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m4 7 8 6 8-6"/></svg>`,
      back: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"/><path d="m11 18-6-6 6-6"/></svg>`,
    };

    const LS = { items:'bunca_v2m_items', shops:'bunca_v2m_shops', settings:'bunca_v2m_settings', admin:'bunca_v2m_admin', cart:'bunca_v2m_cart', orders:'bunca_v2m_orders' };
    const DEFAULT_SHOPS = [
      { id:'city',  name:'City',         whatsapp:'' },
      { id:'gruen', name:'Grüneburgweg', whatsapp:'' },
      { id:'borne', name:'Bornheim',     whatsapp:'' },
    ];
    const DEFAULT_SETTINGS = { storageEmail:'lager@buncacoffee.de', storagePhone:'+4969123456' };
    function uid(){ return (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2)); }
    function load(k,fb){ try{const raw=localStorage.getItem(k); return raw? JSON.parse(raw): fb;}catch{return fb;} }
    function save(k,v){ localStorage.setItem(k, JSON.stringify(v)); }
    function defaultItems(){ return [
      { id:uid(), name:'Espresso 1kg', sku:'COF-ESP-1KG', unit:'bag',   stock_qty:24, min_stock:5,  category:'Coffee',     is_active:true },
      { id:uid(), name:'Filter 1kg',   sku:'COF-FLT-1KG', unit:'bag',   stock_qty:18, min_stock:5,  category:'Coffee',     is_active:true },
      { id:uid(), name:'Cups 200ml',   sku:'CUP-200',     unit:'sleeve',stock_qty:80, min_stock:20, category:'Packaging',  is_active:true },
      { id:uid(), name:'Lids 200ml',   sku:'LID-200',     unit:'sleeve',stock_qty:60, min_stock:15, category:'Packaging',  is_active:true },
      { id:uid(), name:'Oat Milk 1L',  sku:'OAT-1L',      unit:'box',   stock_qty:30, min_stock:6,  category:'Milk',       is_active:true },
    ];}

    const state = {
      adminAuthed: load(LS.admin, false),
      shops: load(LS.shops, DEFAULT_SHOPS),
      settings: load(LS.settings, DEFAULT_SETTINGS),
      items: load(LS.items, defaultItems()),
      cart: load(LS.cart, { shopId:'city', q:{} }),
      orders: load(LS.orders, []),
      orderNotes: '',
      filters: { search:'', cat:'All' },
    };
    function persist(){ save(LS.items, state.items); save(LS.shops, state.shops); save(LS.settings, state.settings); save(LS.admin, state.adminAuthed); save(LS.cart, state.cart); save(LS.orders, state.orders); }

    // --- Toasts: replace jarring native alert() with a non-blocking, dismissible notice ---
    function toast(message, type){
      const root = document.getElementById('toastRoot');
      const el = document.createElement('div');
      el.className = 'toast' + (type ? ' '+type : '');
      el.textContent = message;
      el.onclick = ()=> dismissToast(el);
      root.appendChild(el);
      setTimeout(()=> dismissToast(el), 3600);
    }
    function dismissToast(el){
      if (!el.isConnected || el.classList.contains('leaving')) return;
      el.classList.add('leaving');
      setTimeout(()=> el.remove(), 160);
    }

    // --- Modal: replaces native prompt()/confirm() so admin sign-in and destructive actions
    // get a real, on-brand dialog instead of a browser-chrome popup. ---
    function escHandler(e){ if (e.key==='Escape') closeModal(); }
    function openModal(contentHtml, onMount){
      const root = document.getElementById('modalRoot');
      root.innerHTML = `<div class="modal-backdrop" data-close></div><div class="modal-panel" role="dialog" aria-modal="true">${contentHtml}</div>`;
      root.classList.add('open');
      root.querySelector('[data-close]').onclick = closeModal;
      document.addEventListener('keydown', escHandler);
      if (onMount) onMount(root);
    }
    function closeModal(){
      const root = document.getElementById('modalRoot');
      root.classList.remove('open');
      root.innerHTML = '';
      document.removeEventListener('keydown', escHandler);
    }
    function confirmModal(message, opts){
      opts = opts || {};
      return new Promise(resolve=>{
        let settled = false;
        const finish = (val)=>{ if (settled) return; settled = true; closeModal(); resolve(val); };
        openModal(`
          <h3 class="h1 text-lg mb-2">${opts.title||'Please confirm'}</h3>
          <p class="text-sm text-black/70 mb-5">${message}</p>
          <div class="flex items-center gap-2 justify-end">
            <button class="btn btn-ghost" data-cancel>Cancel</button>
            <button class="btn ${opts.danger?'btn-danger':'btn-primary'}" data-ok>${opts.okText||'Confirm'}</button>
          </div>`, (root)=>{
            root.querySelector('[data-cancel]').onclick = ()=> finish(false);
            root.querySelector('[data-ok]').onclick = ()=> finish(true);
            root.querySelector('[data-close]') && (root.querySelector('[data-close]').onclick = ()=>{ closeModal(); resolve(false); });
          });
      });
    }

        </div>

        <p id="adminPwError" class="text-xs mt-2 hidden" style="color:var(--danger)">Incorrect password.</p>
        <div class="flex items-center gap-2 justify-end mt-4">
          <button class="btn btn-ghost" data-cancel>Cancel</button>
          <button class="btn btn-primary" data-ok>Unlock</button>
        </div>`, (root)=>{
          const input = root.querySelector('#adminPw');

      document.getElementById('reviewBtn').onclick = ()=>{
        const any = Object.values(state.cart.q).some(v=> Number(v||0) > 0);
        if (!any) { toast('Please add at least one item.', 'warn'); return; }
        navigate('#/review');

      document.getElementById('clearOrderBtn').onclick = async ()=>{
        const ok = await confirmModal('This clears every quantity you’ve entered for this order.', { title:'Clear order?', okText:'Clear', danger:true });
        if (ok) { state.cart.q = {}; persist(); render(); toast('Order cleared.'); }
      };
      // Refresh only the summary count + Clear-order visibility on blur, instead of a full
      // render(): rebuilding the whole #page mid-gesture could swap out whatever the user's
      // pointer was already headed for (e.g. tapping "Review Order" right after typing a
      // quantity), silently eating that click since the browser's click lands on a
      // freshly-replaced node instead of the one the gesture started on.
      function updateOrderSidebarSummary(){
        const n = Object.values(state.cart.q).reduce((acc,v)=> acc + (Number(v||0)>0?1:0), 0);

            <p class="mt-3 text-xs text-black/60">Lines: <b>${totalLines}</b>. Stock will be decremented in this demo after sending, and the order form will clear so it can't be sent twice by accident.</p>

      document.getElementById('notes').oninput = e=> { state.orderNotes = e.target.value; persist(); };

      function pickNumber(){
        const val = document.querySelector('input[name="wa"]:checked')?.value;
        if (val==='storage') return state.settings.storagePhone;
        if (val==='shop') return (state.shops.find(s=>s.id===state.cart.shopId)?.whatsapp || '');
        if (val==='custom') return document.getElementById('waCustom').value;
        return '';
      }

      async function generatePdf(lines){
        try {
          const { jsPDF } = window.jspdf || {}; if(!jsPDF) throw new Error('no jsPDF');
          const doc = new jsPDF(); let y=16; const line=(t)=>{doc.text(t,14,y);y+=6;};
          doc.setFontSize(16); line('BUNCA Coffee — Storage Pick List'); y+=2;
          doc.setFontSize(12); line('Shop: '+(shop?.name||'')); line('Created: '+new Date().toLocaleString()); y+=2; line('Items:');
          lines.forEach(l=>{ if(y>280){doc.addPage(); y=16;} line(`• ${l.name} (${l.sku}) — Qty: ${l.qty} ${l.unit}`); });
          y+=2; line('Notes: '+(state.orderNotes||'—')); const filename=`Order_${shop?.id||'shop'}_${Date.now()}.pdf`; doc.save(filename); return filename;
        } catch (e) {
          const txt = ['BUNCA Coffee — Storage Pick List','Shop: '+(shop?.name||''),'Created: '+new Date().toLocaleString(),'','Items:', ...lines.map(l=> `- ${l.name} (${l.sku}) x ${l.qty} ${l.unit}`),'','Notes: '+(state.orderNotes||'—')].join('\n');
          const blob = new Blob([txt], { type: 'text/plain' }); const a = document.createElement('a');
          a.href = URL.createObjectURL(blob); a.download = `Order_${shop?.id||'shop'}_${Date.now()}.txt`; a.click(); URL.revokeObjectURL(a.href);
        }
      }

      function recordAndClearOrder(lines){
        state.orders.unshift({
          id: uid(),
          shopId: state.cart.shopId,
          shopName: shop?.name || '',
          createdAt: Date.now(),
          notes: state.orderNotes || '',
          lines: lines.map(l=> ({ name:l.name, sku:l.sku, qty:l.qty, unit:l.unit }))
        });
        // Cap history so localStorage never grows unbounded.
        if (state.orders.length > 200) state.orders.length = 200;
        state.cart.q = {};
        state.orderNotes = '';
      }

      // Shared by every send channel so an order is decremented, logged, and the cart
      // cleared exactly once regardless of whether it left via WhatsApp or email - matching
      // channels here previously skipped this (see commit history), letting the same cart
      // be sent twice (once untracked) or resent a second time after an "untracked" email.
      async function finalizeOrder(lines){
        await generatePdf(lines);
        lines.forEach(l=>{ const it = state.items.find(x=>x.id===l.id); if (it) it.stock_qty = Math.max(0, (it.stock_qty||0) - l.qty); });
        recordAndClearOrder(lines);
        persist();
      }

      document.getElementById('sendBtn').onclick = async ()=>{

        const numberRaw = pickNumber(); const number = String(numberRaw||'').replace(/\D/g,'');
        if (!number) { toast('Choose a WhatsApp number first.', 'warn'); return; }
        await finalizeOrder(lines);
        const waText = encodeURIComponent(`New order from ${shop?.name}:\n` + lines.map(l=> `${l.name} x ${l.qty}`).join('\n'));
        window.open('https://wa.me/'+number+'?text='+waText, '_blank');
        toast('Order sent — PDF saved and WhatsApp draft opened.', 'success');
        navigate('#/order');

      document.getElementById('emailBtn').onclick = async ()=>{
        if (!lines.length) { toast('No lines to send.', 'warn'); return; }

        const body = encodeURIComponent(lines.map(l=> `${l.name} (${l.sku}) x ${l.qty}`).join('\n') + (state.orderNotes? `\n\nNotes: ${state.orderNotes}`:''));
        const mailto = `mailto:${state.settings.storageEmail}?subject=${subject}&body=${body}`;

        toast('Order sent — PDF saved and email draft opened.', 'success');
        navigate('#/order');
      };
    }

          </div>

          <div class="card p-4 mt-4 overflow-auto">
            <table class="w-full text-sm">
              <thead class="text-left text-black/60"><tr><th>Name</th><th>Unit</th><th>Stock</th><th>Min</th><th>Category</th><th>Status</th><th>Delete</th></tr></thead>
              <tbody>${rows}</tbody>
            </table>
          </div>

          <div class="card p-4 mt-4">
            <h3 class="font-semibold mb-3">CSV Tools</h3>
            <div class="flex items-center gap-2">
              <button id="exportCsv" class="btn btn-ghost">Export CSV</button>
            </div>
            <div class="mt-3">
              <p class="text-sm text-black/60 mb-2">Paste CSV (name,sku,unit,stock_qty,min_stock,category) and click Import:</p>
              <textarea id="csvText" class="input w-full min-h-28 md:min-h-32" placeholder="Espresso 1kg,COF-ESP-1KG,bag,24,5,Coffee"></textarea>
              <button id="importCsv" class="btn btn-accent mt-2">Import CSV</button>
            </div>
          </div>
        </div>`;

      document.getElementById('addBtn').onclick = ()=> {
        const name = document.getElementById('addName').value.trim();
        const sku = document.getElementById('addSku').value.trim();
        const unit = document.getElementById('addUnit').value.trim();
        const stock = Number((document.getElementById('addStock').value||'').replace(/[^0-9]/g,''))||0;
        const min   = Number((document.getElementById('addMin').value||'').replace(/[^0-9]/g,''))||0;
        const cat   = document.getElementById('addCat').value.trim() || null;
        if (!name || !sku || !unit) { toast('Fill in name, SKU, and unit first.', 'warn'); return; }
        state.items.push({ id:uid(), name, sku, unit, stock_qty:stock, min_stock:min, category:cat, is_active:true });
        persist(); render(); toast('Item added.', 'success');
      };

      document.querySelectorAll('[data-stock]').forEach(inp=> inp.oninput = e => {
        const it = state.items.find(x=> x.id===inp.getAttribute('data-stock')); it.stock_qty = Number((e.target.value||'').replace(/[^0-9]/g,''))||0; persist();
      });
      document.querySelectorAll('[data-min]').forEach(inp=> inp.oninput = e => {
        const it = state.items.find(x=> x.id===inp.getAttribute('data-min')); it.min_stock = Number((e.target.value||'').replace(/[^0-9]/g,''))||0; persist();
      });
      document.querySelectorAll('[data-cat]').forEach(inp=> inp.oninput = e => {
        const it = state.items.find(x=> x.id===inp.getAttribute('data-cat')); it.category = e.target.value || null; persist();
      });
      document.querySelectorAll('[data-toggle]').forEach(btn=> btn.onclick = ()=> {
        const it = state.items.find(x=> x.id===btn.getAttribute('data-toggle')); it.is_active = !(it.is_active!==false); persist(); render();
      });
      document.querySelectorAll('[data-del]').forEach(btn=> btn.onclick = async ()=> {
        const id = btn.getAttribute('data-del');
        const ok = await confirmModal('This permanently removes the item from inventory and from any in-progress order.', { title:'Delete item?', okText:'Delete', danger:true });
        if (ok) {
          state.items = state.items.filter(x=> x.id!==id);
          delete state.cart.q[id]; // an in-progress order must not keep a quantity for an item that no longer exists
          persist(); render(); toast('Item deleted.');
        }
      });

      document.getElementById('exportCsv').onclick = ()=>{
        const header = "name,sku,unit,stock_qty,min_stock,category\n";
        const rows = state.items.map(i=> [i.name, i.sku, i.unit, i.stock_qty||0, i.min_stock||0, i.category||''].map(v=> String(v).replaceAll(',', ' ')).join(',')).join('\n');
        const csv = header + rows + '\n';
        const blob = new Blob([csv], { type:'text/csv' }); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='items.csv'; a.click(); URL.revokeObjectURL(a.href);
      };
      document.getElementById('importCsv').onclick = ()=>{
        const txt = document.getElementById('csvText').value; if(!txt.trim()){ toast('Paste CSV text first.', 'warn'); return; }
        const lines = txt.split(/\r?\n/).map(l=>l.trim()).filter(Boolean); let start=0; if(lines[0].toLowerCase().startsWith('name,')) start=1;
        for(let i=start;i<lines.length;i++){ const p=lines[i].split(','); if(p.length<3) continue; const [name,sku,unit,stock='0',min='0',cat=''] = p;
          const ex = state.items.find(x=> x.sku===sku.trim()); const rec = { id: ex? ex.id: uid(), name:name.trim(), sku:sku.trim(), unit:unit.trim(), stock_qty:Number(stock)||0, min_stock:Number(min)||0, category: (cat||'').trim() || null, is_active:true };
          if (ex) Object.assign(ex, rec); else state.items.push(rec);
        }
        persist(); render(); toast('CSV import complete.', 'success');
      };
    }

    function renderSettingsPage(){
      const shopRows = state.shops.map(s=> `
        <div class="flex items-center gap-2">
          <span class="w-32 md:w-40">${s.name}</span>
          <input data-wa="${s.id}" class="input flex-1 min-w-0" placeholder="+49176…" value="${s.whatsapp||''}"/>
        </div>`).join('');
      document.getElementById('page').innerHTML = `
        <div>
          <h2 class="h1 text-xl md:text-2xl">Settings (Admin)</h2>
          <div class="grid grid-cols-1 lg:grid-cols-2 gap-4 md:gap-6 mt-4">
            <div class="card p-4">
              <h3 class="font-semibold mb-2">Storage Contacts</h3>
              <input id="storageEmail" class="input w-full mb-2" placeholder="Storage email" value="${state.settings.storageEmail||''}"/>
              <input id="storagePhone" class="input w-full" placeholder="Storage phone" value="${state.settings.storagePhone||''}"/>
            </div>
            <div class="card p-4">
              <h3 class="font-semibold mb-2">Shop WhatsApp Numbers</h3>
              <div class="space-y-2">${shopRows}</div>
            </div>
          </div>
        </div>`;
      document.getElementById('storageEmail').oninput = e=> { state.settings.storageEmail = e.target.value; persist(); };
      document.getElementById('storagePhone').oninput = e=> { state.settings.storagePhone = e.target.value; persist(); };
      document.querySelectorAll('[data-wa]').forEach(inp=> inp.oninput = e=>{
        const s = state.shops.find(x=> x.id===inp.getAttribute('data-wa')); s.whatsapp = e.target.value; persist();
      });
    }

    function renderAdminLock(){
      document.getElementById('page').innerHTML = `
        <div class="card p-8 max-w-md mx-auto text-center">
          <div class="w-12 h-12 rounded-2xl bg-[var(--accent-soft)] text-[var(--accent)] grid place-items-center mx-auto mb-4">${ICONS.lock}</div>
          <h2 class="h1 text-2xl">Admin only</h2>
          <p class="text-black/70 mt-2">This area is for storage admins. Sign in to continue.</p>
          <button id="adminLockSignIn" class="btn btn-primary mt-5">${ICONS.lock}<span>Sign in</span></button>
        </div>`;
      document.getElementById('adminLockSignIn').onclick = openAdminLoginModal;
    }

    function render(){
      document.getElementById('year').textContent = new Date().getFullYear();
      setTabsActive(); renderShopSwitch(); adminToggle(); updateHeroStats();
      const route = currentRoute(); const fn = routes[route] || renderOrderPage; fn();
    }
    window.addEventListener('hashchange', ()=>{ setTabsActive(); render(); });
    if (!location.hash) location.hash = '#/order';
    render();
  </script>
</body>
</html>
